[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flowfolio"
version = "0.1.1"
description = "Portable strategy protocols and backtests for recurring cash flows and long-term allocation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "flowfolio contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business :: Financial :: Investment"]

[project.optional-dependencies]
backtrader = ["backtrader==1.9.78.123"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "hatchling>=1.27,<2"]

[project.scripts]
flowfolio = "flowfolio.cli:main"

[project.urls]
Repository = "https://github.com/Joo1024/flowfolio"

[tool.hatch.build.targets.wheel]
packages = ["src/flowfolio"]

[tool.hatch.build.targets.sdist]
include = ["src", "strategies", "cases", "tests", "docs", "examples", ".github", ".gitignore", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "strategies"]
addopts = "-ra"
