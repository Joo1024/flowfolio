name: conformance
on:
  push:
    branches: [develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-cache-dir '.[dev,backtrader]'
      - run: python -m pytest -p no:cacheprovider --basetemp="$RUNNER_TEMP/pytest" --junitxml="$RUNNER_TEMP/junit.xml"
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m build --outdir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.python }}
          path: ${{ runner.temp }}/junit.xml
